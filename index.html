<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Linux VM</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-bottom: 10px; }
        #status { color: #00ff00; margin-bottom: 20px; }
        #screen {
            background: #000;
            border: 2px solid #444;
        }
    </style>
</head>
<body>
    <h1>🐧 Browser Linux VM</h1>
    <p id="status">読み込み中...</p>
    <div id="screen"></div>

    <script src="https://copy.sh/v86/lib/v86.js"></script>
    <script>
        const statusEl = document.getElementById('status');

        var emulator = new V86({
            wasm_path: "https://copy.sh/v86/lib/v86.wasm",
            memory_size: 64 * 1024 * 1024,
            vga_memory_size: 2 * 1024 * 1024,
            screen_container: document.getElementById("screen"),
            bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
            vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
            // ネットワーク設定を一旦削除
            autostart: true,
            start_cb: function() {
                statusEl.innerText = "Linux起動中...";
            },
            emulator_started_cb: function() {
                statusEl.innerText = "✅ 起動完了！";
            }
        });
    </script>
</body>
</html>
